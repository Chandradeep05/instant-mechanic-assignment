# Production Nginx reverse-proxy configuration with WebSocket upgrade support for AWS EC2 deployment

upstream asgi_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    # IMPORTANT: Replace _ with your actual EC2 public IP or domain before production deploy.
    # Example: server_name 13.233.44.55 api.instantmechanic.in;
    server_name _;

    client_max_body_size 20M;

    # Static files served directly
    location /static/ {
        alias /var/www/instant-mechanic/backend/staticfiles/;
    }

    # REST API and Standard HTTP traffic
    location / {
        proxy_pass http://asgi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Channels WebSocket Routing with Upgrade Headers
    location /ws/ {
        proxy_pass http://asgi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
