[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = tests.py test_*.py *_tests.py
addopts = --nomigrations

# Environment variables for local test runs.
# The fail-closed production guards require these when DEBUG=False.
# DEBUG=True here enables the safe dev fallback without needing real secrets.
env =
    DEBUG=True
    DJANGO_SECRET_KEY=pytest-test-only-secret-key-not-for-production
    ALLOWED_HOSTS=localhost,127.0.0.1,testserver
    CORS_ALLOWED_ORIGINS=http://localhost:5173
