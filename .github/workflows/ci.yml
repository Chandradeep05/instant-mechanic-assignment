name: CI & PostgreSQL Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-postgres-tests:
    name: Backend Tests (PostgreSQL 15)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: instant_mechanic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-env

      - name: Run Django Migrations on PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/instant_mechanic_test
          DJANGO_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          python manage.py migrate

      - name: Execute Pytest Suite against PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/instant_mechanic_test
          DJANGO_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          pytest -v

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend (TypeScript + Vite)
        run: npm run build
